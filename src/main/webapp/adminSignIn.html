<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/findabookLogo.png">

    <title>Admin Sign In - FindABook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                    radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.4) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(240, 147, 251, 0.4) 0%, transparent 50%);
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .floating-elements {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .float-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: float 20s infinite ease-in-out;
        }

        .circle-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 10%;
            animation-delay: 3s;
        }

        .circle-3 {
            width: 80px;
            height: 80px;
            bottom: 15%;
            left: 15%;
            animation-delay: 6s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            33% {
                transform: translateY(-30px) rotate(120deg);
            }

            66% {
                transform: translateY(30px) rotate(240deg);
            }
        }

        .auth-container {
            max-width: 1000px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .auth-wrapper {
            display: grid;
            grid-template-columns: 55% 45%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .auth-left {
            background: white;
            padding: 60px 50px;
            overflow-y: auto;
            max-height: 95vh;
        }

        .auth-left::-webkit-scrollbar {
            width: 6px;
        }

        .auth-left::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .auth-left::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #718096;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Modern Floating Label Input */
        .input-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .form-input {
            width: 100%;
            padding: 18px 20px 18px 52px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            background: #fafbfc;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-input:focus~.floating-label,
        .form-input:not(:placeholder-shown)~.floating-label {
            top: -10px;
            left: 48px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #667eea;
            background: white;
            padding: 0 8px;
        }

        .floating-label {
            position: absolute;
            left: 52px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        .input-icon-left {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            width: 20px;
            height: 20px;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .form-input:focus~.input-icon-left {
            color: #667eea;
        }

        .input-icon-right {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            cursor: pointer;
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
        }

        .input-icon-right:hover {
            color: #667eea;
            transform: translateY(-50%) scale(1.15);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 32px;
        }

        /* Modern Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .checkbox-input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border: 2px solid #cbd5e0;
            border-radius: 7px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .checkbox-input:checked~.checkbox-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            transform: scale(1.05);
        }

        .checkbox-custom::after {
            content: '';
            width: 11px;
            height: 11px;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M6 10l3 3l6-6'/%3e%3c/svg%3e");
            background-size: contain;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .checkbox-input:checked~.checkbox-custom::after {
            opacity: 1;
            transform: scale(1);
        }

        .checkbox-label {
            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            color: #764ba2;
            transform: translateX(3px);
        }

        /* Modern Button */
        .btn-submit {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 36px 0;
            color: #a0aec0;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
        }

        .divider::before {
            margin-right: 20px;
        }

        .divider::after {
            margin-left: 20px;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 32px;
        }

        .social-btn {
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            color: #4a5568;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .social-btn:hover {
            border-color: #667eea;
            background: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .signup-link {
            text-align: center;
            padding-top: 28px;
            border-top: 2px solid #e2e8f0;
            color: #4a5568;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 800;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #764ba2;
        }

        .auth-right {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .auth-right::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .auth-right-content {
            position: relative;
            z-index: 1;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .brand-text h2 {
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0;
        }

        .auth-right h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .auth-right p {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 50px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            margin-bottom: 8px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 991px) {
            .auth-wrapper {
                grid-template-columns: 1fr;
            }

            .auth-right {
                padding: 40px 30px;
                order: -1;
            }

            .auth-right h1 {
                font-size: 1.75rem;
            }

            .stats {
                gap: 20px;
            }

            .auth-left {
                padding: 40px 30px;
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .auth-wrapper {
                border-radius: 20px;
            }

            .auth-left,
            .auth-right {
                padding: 30px 24px;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }

            .social-login {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .stat-item {
                padding: 16px;
            }

            .stat-number {
                font-size: 1.6rem;
            }

            .stat-label {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .auth-right h1 {
                font-size: 1.5rem;
            }

            .form-input {
                padding: 16px 18px 16px 48px;
                font-size: 0.95rem;
            }

            .floating-label {
                left: 48px;
                font-size: 0.95rem;
            }

            .form-input:focus~.floating-label,
            .form-input:not(:placeholder-shown)~.floating-label {
                left: 44px;
            }

            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }

        .logo-img {
            height: 40px;
            width: auto;
        }
    </style>
</head>

<body>
<div class="floating-elements">
    <div class="float-circle circle-1"></div>
    <div class="float-circle circle-2"></div>
    <div class="float-circle circle-3"></div>
</div>

<div class="auth-container">
    <div class="auth-wrapper">
        <!-- Left Panel - Form -->
        <div class="auth-left">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to Manage Your Store</p>
            </div>

            <form id="signinForm">
                <div class="input-wrapper">
                    <input type="email" class="form-input" id="email" placeholder=" ">
                    <label class="floating-label">Email Address</label>
                    <i data-feather="mail" class="input-icon-left"></i>
                </div>

                <div class="input-wrapper">
                    <input type="password" class="form-input" id="password" placeholder=" ">
                    <label class="floating-label">Password</label>
                    <i data-feather="lock" class="input-icon-left"></i>
                    <i data-feather="eye" class="input-icon-right" id="togglePassword"
                       onclick="togglePassword()"></i>
                </div>



                <button type="button" class="btn-submit" onclick="AdminSignIn()">Sign In</button>
            </form>

        </div>

        <!-- Right Panel - Info -->
        <div class="auth-right">
            <div class="auth-right-content">


                <a href="/" class="navbar-brand">
                    <img src="assets/images/findabookLogo2.png" alt="BookWorm Haven Logo" class="logo-img">
                </a>

                <h1>Manage Your Store</h1>
                <p>Sign in to manage the store, add new books, manage inventory and more.</p>

                <!-- <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number">50K+</div>
                        <div class="stat-label">Books</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">10K+</div>
                        <div class="stat-label">Readers</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">4.9★</div>
                        <div class="stat-label">Rating</div>
                    </div>
                </div> -->
            </div>
        </div>
    </div>
</div>



<script>
    feather.replace();

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('togglePassword');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.setAttribute('data-feather', 'eye-off');
        } else {
            passwordInput.type = 'password';
            icon.setAttribute('data-feather', 'eye');
        }
        feather.replace();
    }

</script>

<script src="assets/js/signIn.js"></script>
<script src="assets/js/forgotPw.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
